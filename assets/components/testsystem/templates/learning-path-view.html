    <script>
        // Additional page-specific logic
        document.addEventListener('DOMContentLoaded', function() {
            const pathId = document.getElementById('path-view-container').dataset.pathId;

            if (!pathId || pathId === '0') {
                document.getElementById('path-view-container').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i>
                        Траектория не найдена. <a href="/learning-paths">Вернуться к списку</a>
                    </div>
                `;
                return;
            }

            // Load achievements
            loadPathAchievements(pathId);
        });

        async function loadPathAchievements(pathId) {
            try {
                const response = await fetch('/assets/components/testsystem/ajax/testsystem.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'getPathAchievements',
                        data: { path_id: parseInt(pathId) }
                    })
                });

                const result = await response.json();

                if (result.success && result.data && result.data.length > 0) {
                    renderAchievements(result.data);
                }
            } catch (error) {
                console.error('Load achievements error:', error);
            }
        }

        function renderAchievements(achievements) {
            const section = document.getElementById('achievements-section');
            const container = document.getElementById('achievements-container');

            if (!achievements || achievements.length === 0) {
                return;
            }

            section.style.display = 'block';

            let html = '';
            achievements.forEach(achievement => {
                const icon = achievement.badge_icon || 'bi-star-fill';
                const conditionText = getConditionText(achievement);

                html += `
                    <div class="col-md-4">
                        <div class="card h-100">
                            <div class="card-body text-center">
                                <i class="bi ${icon} display-4 text-warning mb-3"></i>
                                <h5>${escapeHtml(achievement.name)}</h5>
                                <p class="text-muted small">${escapeHtml(achievement.description || '')}</p>
                                <span class="badge bg-secondary">${conditionText}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function getConditionText(achievement) {
            switch (achievement.condition_type) {
                case 'complete_path':
                    return 'Завершите траекторию';
                case 'score_threshold':
                    return `Наберите ${achievement.condition_value}% и выше`;
                case 'perfect_score':
                    return 'Получите 100% результат';
                case 'time_limit':
                    return `Завершите за ${achievement.condition_value} дней`;
                default:
                    return 'Специальное условие';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
